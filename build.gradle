plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def tc4Repository = file(providers.gradleProperty('tc4Repository').getOrElse('local-repo'))

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Dependencies carry refmaps compiled with production mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('run-client')
            // The Rosetta bridge only listens once a world is joined, so automated client runs quick-play one.
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
            // Its own port, so a client and a dedicated server can be probed side by side.
            property 'rosetta.remote.port', '48791'
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'LocalTC4R'
        url = uri(tc4Repository)
        content { includeGroup 'dev.tc4port' }
    }
    maven { url = 'https://maven.theillusivec4.top' }
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation(fg.deobf("dev.tc4port:thaumcraft-forge:${thaumcraft_version}", { transitive = false }))
    // TC4R declares both mandatory, and the Somatic Brain is a Curios head item.
    implementation(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}", { transitive = false }))
    runtimeOnly(fg.deobf("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}", { transitive = false }))

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.register('verifyLocalDependencies') {
    group = 'verification'
    description = 'Checks supplied TC4R artifacts against the recorded SHA-256 hashes.'
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(file('local-repo/DEPENDENCIES.json'))
        manifest.artifacts.each { artifact ->
            def target = new File(tc4Repository, artifact.path)
            if (!target.isFile()) {
                throw new GradleException("Missing ${target}. Copy it from ../Technomancy-1.20.1/local-repo; see local-repo/README.md.")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString()
            if (digest != artifact.sha256) {
                throw new GradleException("TC4R checksum mismatch: ${target.name}. Keep the version and manifest in sync.")
            }
        }
        logger.lifecycle("Verified ${manifest.artifacts.size()} TC4R artifacts in ${tc4Repository}")
    }
}
tasks.named('compileJava').configure { dependsOn 'verifyLocalDependencies' }

tasks.named('processResources', ProcessResources).configure {
    def values = [minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            thaumcraft_runtime_version: thaumcraft_runtime_version]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values }
}

tasks.named('jar', Jar).configure {
    // Forge 1.20.1 reads mixin configs only from the MixinConfigs manifest attribute. Dev runs load the exploded
    // resources directory, which carries the same attribute in META-INF/MANIFEST.MF; the jar gets a generated one.
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes('Specification-Title': mod_name, 'Specification-Vendor': mod_authors,
                'Specification-Version': '1', 'Implementation-Title': project.name,
                'Implementation-Version': project.version, 'Implementation-Vendor': mod_authors,
                'MixinConfigs': "${mod_id}.mixins.json")
    }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
